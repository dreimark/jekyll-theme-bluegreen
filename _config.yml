# Environment Variables
env:
  production:
    url: "https://dreimark.com"
    baseurl: ""
    analytics: "UA-XXXXX-Y" # Google Analytics ID
    disqus_shortname: "dreimark"
  preview:
    url: "https://preview.dreimark.com"
    baseurl: "/preview"
    analytics: "UA-XXXXX-Z"
    disqus_shortname: "dreimark-preview"

# Performance Improvements
performance:
  lazy_load_images: true
  preconnect:
    - "https://fonts.googleapis.com"
    - "https://fonts.gstatic.com"
  dns_prefetch:
    - "https://fonts.googleapis.com"
    - "https://fonts.gstatic.com"

# Additional Features
features:
  dark_mode_toggle: true
  scroll_to_top_button: true
  toc: true # Enable Table of Contents for posts
  mathjax: true # Enable MathJax for rendering mathematical equations
  mermaid: true # Enable Mermaid.js for diagrams and flowcharts

# Social Media Links
social_links:
  twitter: "https://twitter.com/dreimark"
  github: "https://github.com/dreimark"
  linkedin: "https://linkedin.com/in/michael-huber"
  mastodon: "https://mastodon.social/@dreimark"

# Enhanced SEO
seo:
  sitemap_priority: 0.8
  sitemap_changefreq: "weekly"
  robots: "index, follow"
  canonical_base: "https://dreimark.com"

# Enhanced Footer
footer:
  links:
    - label: "Privacy Policy"
      url: "/privacy-policy/"
    - label: "Terms of Service"
      url: "/terms-of-service/"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/dreimark"

# Enhanced Header Navigation
header:
  nav:
    - label: "Projects"
      url: "/projects/"
    - label: "Blog"
      url: "/blog/"
    - label: "Resources"
      url: "/resources/"
    - label: "About"
      url: "/about/"

# Enhanced Markdown Settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: true
    span:
      line_numbers: false

# Enhanced HTTPS Settings
https: true
force_https: true
http2: true
ssl:
  protocols: ["TLSv1.2", "TLSv1.3"]
  ciphers: "HIGH:!aNULL:!MD5"
  ocsp_stapling: true
  hsts:
    enabled: true
    max_age: 31536000
    include_subdomains: true
    preload: true
  certificate_pinning:
    enabled: true
    pins:
      - "sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      - "sha256/BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB="

# Enhanced Pagination
paginate: 10
paginate_path: /page:num/

# Enhanced Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-assets
  - jekyll-redirect-from

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
year_archive:
  type: liquid
  path: /year/

# Enhanced Sass Settings
sass:
  sass_dir: _sass
  style: compressed
  source_map: true

# Enhanced Defaults for Posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      toc: true
      mathjax: true
      mermaid: true